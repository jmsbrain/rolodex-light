[tool]
id = "com.jmsbrain.rolodex"
label = "Rolodex Light"
versionCode = 7
versionName = "0.2.2"
# INTERNET: CardDAV sync, only with the server the user signs in to.
# Contacts live inside the tool for now. Once LightOS allows it, add
# "android.permission.READ_CONTACTS" and "android.permission.WRITE_CONTACTS"
# here (see ENABLE_PHONE_CONTACTS.md).
permissions = ["android.permission.INTERNET"]
capabilities = ["tool-manager-provider"]
orientation = "portrait"
# for the LightOS emulator, use the line below and build with -DlightSdk.allowAltServerPackage=true
# serverPackage = "com.thelightphone.sdk.emulator"
serverPackage = "com.lightos"
